name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#permissions
permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  BUILD_TAG: librenms:test
  CONTAINER_NAME: librenms
  PUID: "1234"
  PGID: "1235"

jobs:
  test:
    if: github.repository == 'librenms/docker'
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.version == 'master' }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - ''
          - master
    steps:
      -
        name: Prepare
        if: matrix.version != ''
        run: |
          echo "LIBRENMS_VERSION=${{ matrix.version }}" >> $GITHUB_ENV
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Build
        uses: docker/bake-action@v7
        with:
          source: .
          targets: image-local
        env:
          DEFAULT_TAG: ${{ env.BUILD_TAG }}
      -
        name: Start
        run: |
          docker compose up -d
        working-directory: test
        env:
          LIBRENMS_IMAGE: ${{ env.BUILD_TAG }}
          LIBRENMS_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Check container logs
        uses: crazy-max/.github/.github/actions/container-logs-check@v1
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "ready to handle connections"
          timeout: 120
      -
        name: Check services
        run: |
          for service in librenms dispatcher syslogng snmptrapd; do
            docker compose exec -T "$service" sh -s < services.sh
          done
          docker compose exec -T librenms curl --fail --retry 5 --retry-connrefused http://127.0.0.1:8000/login
        working-directory: test
        env:
          LIBRENMS_IMAGE: ${{ env.BUILD_TAG }}
          LIBRENMS_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Logs
        if: always()
        run: |
          docker compose logs
        working-directory: test
        env:
          LIBRENMS_IMAGE: ${{ env.BUILD_TAG }}
          LIBRENMS_CONTAINER: ${{ env.CONTAINER_NAME }}
